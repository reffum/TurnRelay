[package]
name = "turn_tunnel_lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
jni = "0.22.4"
tokio = {version = "1", features = ["full"]}
tokio-util = "0"
webrtc = {version = "0.17.1"}
nix = { version = "0.31.2", features = ["fs"] }
log = "0"
android_logger = "0"

[[example]]
name = "use_example"
path = "examples/use_example.rs"
